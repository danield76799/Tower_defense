name: Build Release (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    # Versie: code = 2000 + run_number (monotoon, uniek),
    # naam = 0.1.<runs> (patch-bump per release).
    - name: Compute version
      id: ver
      run: |
        CODE=$((2000 + ${{ github.run_number }}))
        NAME="0.1.${{ github.run_number }}"
        echo "code=$CODE" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "Version: $NAME (code $CODE)"

    - name: Setup signing config
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
          echo "has_signing=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_signing=false" >> "$GITHUB_OUTPUT"
          echo "WARNING: no signing secrets — debug-signed APK"
        fi

    - name: Run tests
      run: flutter test

    - name: Build APK
      run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}

    - name: Verify APK signatures
      run: |
        BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -type d | sort -V | tail -1)
        for apk in build/app/outputs/flutter-apk/*-release.apk; do
          echo "Verifying $apk"
          $BUILD_TOOLS_DIR/apksigner verify -v "$apk" | tail -3
        done

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        tag_name: td-v${{ github.run_number }}
        name: Tower Defense ${{ steps.ver.outputs.name }}
        body: |
          Tower Defense voor tablet — landschapsoriëntatie

          - `app-arm64-v8a-release.apk` — moderne telefoons/tablets
          - `app-armeabi-v7a-release.apk` — oudere apparaten

          Versie: **${{ steps.ver.outputs.name }}** (code ${{ steps.ver.outputs.code }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}